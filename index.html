<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>РЕГИСТРАЦИЯ КОМАНДЫ</title>
  <!-- Telegram WebApp SDK: provides window.Telegram.WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Theme: uses Telegram theme colors with sensible fallbacks */
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #1a1a1a);
      --hint: var(--tg-theme-hint-color, #8a8a8a);
      --field: var(--tg-theme-secondary-bg-color, #f2f3f5);
      --btn: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px 16px 90px;
      background: var(--bg); color: var(--text);
      font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 20px; margin: 0 0 16px; }
    label { display: block; margin: 14px 0 6px; font-size: 14px; color: var(--hint); }
    input, select, textarea {
      width: 100%; padding: 12px; border: 1px solid transparent; border-radius: 10px;
      background: var(--field); color: var(--text); font: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--btn); }
    textarea { min-height: 90px; resize: vertical; }
    .error { color: #d33; font-size: 13px; margin-top: 4px; min-height: 16px; }
    /* Fallback submit button, shown only outside Telegram (for browser testing) */
    #fallback-btn {
      display: none; width: 100%; margin-top: 20px; padding: 14px; border: 0;
      border-radius: 10px; background: var(--btn); color: var(--btn-text); font: inherit;
    }
  </style>
</head>
<body>
  <h1>🚀 Регистрация</h1>

  <!-- Form fields: keep names in sync with REQUIRED_FIELDS in handlers/registration.py -->
  <form id="form" novalidate>
    <label for="team_name">Название команды *</label>
    <input id="team_name" name="team_name" maxlength="100" autocomplete="off" />
    <div class="error" data-for="team_name"></div>

    <label for="captain_name">ФИО Капитана *</label>
    <input id="captain_name" name="captain_name" maxlength="100" autocomplete="name" />
    <div class="error" data-for="captain_name"></div>

    <label for="email">Телеграм *</label>
    <input id="email" name="email" type="email" maxlength="150" autocomplete="email" />
    <div class="error" data-for="email"></div>

    <label for="university">Группа</label>
    <input id="university" name="university" maxlength="150" />

    <label for="track">Трек</label>
    <select id="track" name="track">
      <!-- TODO: replace with the real tracks of your hackathon -->
      <option value="general">Разработка</option>
      <!-- <option value="ai">AI / ML</option>
      <option value="web">Web / Mobile</option>
      <option value="iot">IoT / Hardware</option> -->
    </select>

    <label for="members">Остальные участники команды (каждый с новой строки)</label>
    <textarea id="members" name="members" maxlength="1000"></textarea>

    <button type="submit" id="fallback-btn">Register</button>
  </form>

  <script>
    // Telegram init: expands the app and applies the theme
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const form = document.getElementById("form");
    const required = ["team_name", "captain_name", "email"];

    // Validation: returns true if all required fields are valid, shows errors otherwise
    function validate() {
      let ok = true;
      for (const name of required) {
        const value = form.elements[name].value.trim();
        const err = document.querySelector(`.error[data-for="${name}"]`);
        let msg = "";
        if (!value) msg = "Required field";
        else if (name === "email" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(value)) msg = "Invalid email";
        err.textContent = msg;
        if (msg) ok = false;
      }
      return ok;
    }

    // Submit: collects the data and sends it to the bot, which closes the WebApp
    function submitForm(event) {
      if (event) event.preventDefault();
      if (!validate()) {
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
        return;
      }
      const data = Object.fromEntries(new FormData(form).entries());
      for (const key in data) data[key] = String(data[key]).trim();
      tg.sendData(JSON.stringify(data));
    }

    // Button wiring: Telegram's main button inside Telegram, a plain button in a browser
    form.addEventListener("submit", submitForm);
    if (tg.initData) {
      tg.MainButton.setText("Register");
      tg.MainButton.show();
      tg.MainButton.onClick(submitForm);
    } else {
      document.getElementById("fallback-btn").style.display = "block";
    }
  </script>
</body>
</html>
